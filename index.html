  function capSay(html){ capStatus.innerHTML = html; }
  function setToggle(on, persist){
    capOn = !!on;
    if(persist){
      capDefault = capOn;
      try{ window.localStorage.setItem("ledger-refine", capOn ? "1" : "0"); }catch(e){}
    }
    updateCapUI();
  }
  function leaveDraft(){
    capDraft = []; capOrig = ""; capMode = "raw";
    capText.readOnly = false;
    capDraftEl.hidden = true; capDraftEl.innerHTML = "";
    capOn = capDefault && !!sampleFn;
    updateCapUI();
  }

  capRefine.addEventListener("click", function(){ if(!capBusy) setToggle(!capOn, true); });
  capKindEl.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-cap-as]") : null;

  });
  capText.addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); capture(); }

  capGo.addEventListener("click", capture);
  capStatus.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-cap-back]") : null;
    if(!b || capBusy) return;
    leaveDraft(); capSay("");
    capText.focus();

  function isoDay(d){
    function z(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function validDay(s){
    var d = parseDay(s);
    return !!d && isoDay(d) === String(s).slice(0, 10) && /^\d{4}-\d{2}-\d{2}$/.test(s);
  }
  function cleanItem(it){
    if(!it || typeof it !== "object") return null;
    var kind = it.kind === "note" ? "note" : "task";
    var text = trim(String(it.title || it.body || ""));
    if(!text) return null;
    var subj = String(it.subject || "");
    if(!S.subjects.some(function(s){ return s.id === subj; })) subj = "";
    var due = String(it.due || "");
    return {
      kind: kind,
      title: kind === "note" ? "" : text.slice(0, 140),
      body: trim(String(it.body || it.title || "")).slice(0, 2000),
      direction: it.direction === "theirs" ? "theirs" : "mine",
      counterparty: trim(String(it.counterparty || "")).slice(0, 60),
      subject: subj,
      due: validDay(due) ? due : "",
      priority: it.priority === "high" || it.priority === "low" ? it.priority : "normal",
      next_action: trim(String(it.next_action || "")).slice(0, 200)
    };
  }

  function buildPrompt(raw, asKind){
    var subs = S.subjects.filter(function(s){ return s.active !== false; })
      .map(function(s){ return {id: s.id, name: s.name}; });
    var t = today();
    return [
      "You are the intake step of a personal commitments ledger. Split the input into discrete items, one commitment or note per item, and return them as JSON.",
      "",
      "Today is " + isoDay(t) + " (" + t.toLocaleDateString("en-US", {weekday: "long"}) + ").",
      "Subjects (use the id, or \"\" if none fits): " + JSON.stringify(subs),
      "",
      "Rules:",
      (asKind === "note"
        ? "- kind: the user marked this input as a note. Use \"note\" for every item unless an item is plainly an action someone must take."
        : "- kind: default to \"task\". Use \"task\" whenever anyone needs to do, send, follow up, decide, check, deliver or wait on something. Use \"note\" only for pure information with no action. When unsure, choose \"task\"."),
      "- title: imperative, specific, under 12 words. Keep the user's own wording where possible. Do not editorialise.",
      "- direction: \"mine\" if the user owes it; \"theirs\" if someone owes it to the user.",
      "- counterparty: a person or team, plain name; \"\" if none.",
      "- due: YYYY-MM-DD only if the input states or clearly implies a date (resolve relative dates from today). Otherwise \"\". Never invent a date. If the input says to leave a date or timeline out, leave it out.",
      "- priority: \"high\" only if urgency is stated, else \"normal\".",
      "- next_action: only if stated, else \"\".",
      "- Do not drop anything the input contains.",
      "",
      "Reply with only a JSON array, for example:",
      "[{\"kind\":\"task\",\"title\":\"Send Priya the draft\",\"direction\":\"mine\",\"counterparty\":\"Priya\",\"subject\":\"\",\"due\":\"\",\"priority\":\"normal\",\"next_action\":\"\"}]",
      "",
      "Input:",
      "<<<",
      raw,
      ">>>"
    ].join("\n");
  }

  function sel2(opts, cur){
    return opts.map(function(o){
      return '<option value="' + o[0] + '"' + (o[0] === cur ? " selected" : "") + '>' + o[1] + '</option>';
    }).join("");
  }
  function renderDraft(){
    if(!capDraft.length){ capDraftEl.hidden = true; capDraftEl.innerHTML = ""; return; }
    capDraftEl.hidden = false;
    capDraftEl.innerHTML = capDraft.map(function(it, i){
      var isNote = it.kind === "note";
      var f = function(k){ return ' data-cap-f="' + k + '" data-i="' + i + '"'; };
      var typeSw = '<div class="seg seg-dir cd-type" role="group" aria-label="Type">' +
        [["task","Task"],["note","Note"]].map(function(o){
          var on = it.kind === o[0];
          return '<button type="button" aria-pressed="' + (on ? "true" : "false") + '"' +
            (on ? "" : ' data-cap-kind="' + o[0] + '|' + i + '"') + '>' + o[1] + '</button>';
        }).join("") + '</div>';
      var head = '<div class="cd-top">' + typeSw +
        '<button type="button" class="cd-x" data-cap-rm="' + i + '" aria-label="Remove this item">&times;</button></div>';
      if(isNote){
        return '<div class="cd">' + head +
          '<textarea' + f("body") + ' aria-label="Note">' + esc(it.body) + '</textarea>' +
          '<div class="cd-grid"><label class="cd-wide">Subject<select' + f("subject") + '>' + subjectOptions(it.subject) + '</select></label></div>' +
          '</div>';
      }
      return '<div class="cd">' + head +
        '<input type="text"' + f("title") + ' value="' + esc(it.title) + '" placeholder="Title" aria-label="Title">' +
        '<div class="cd-grid">' +
          '<label>Direction<select' + f("direction") + '>' + sel2([["mine","I deliver"],["theirs","Owed to me"]], it.direction) + '</select></label>' +
          '<label>Priority<select' + f("priority") + '>' + sel2([["normal","Normal"],["high","Urgent"],["low","Low"]], it.priority) + '</select></label>' +
          '<label>With<input type="text"' + f("counterparty") + ' value="' + esc(it.counterparty) + '"></label>' +
          '<label>Due<input type="date"' + f("due") + ' value="' + esc(it.due) + '"></label>' +
          '<label class="cd-wide">Subject<select' + f("subject") + '>' + subjectOptions(it.subject) + '</select></label>' +
          '<label class="cd-wide">Next step<input type="text"' + f("next_action") + ' value="' + esc(it.next_action) + '"></label>' +
        '</div></div>';
    }).join("");
  }
  function onDraftEdit(e){
    var t = e.target;
    if(!t || !t.dataset || !t.dataset.capF) return;
    var it = capDraft[+t.dataset.i];
    if(!it) return;
    it[t.dataset.capF] = t.value;
    if(t.dataset.capF === "body") it._bodyEdited = true;
    if(t.dataset.capF === "title") it._titleEdited = true;
  }
  // Switching keeps every field, so switching back loses nothing.
  function switchKind(it, to){
    if(to === "note"){
      if(!it._bodyEdited && trim(it.title || "")) it.body = it.title;
      it.kind = "note";
    } else {
      if(!it._titleEdited && trim(it.body || "")) it.title = trim(it.body.replace(/\s+/g, " ")).slice(0, 90);
      it.kind = "task";
    }
  }
  capDraftEl.addEventListener("input", onDraftEdit);
  capDraftEl.addEventListener("change", onDraftEdit);
  capDraftEl.addEventListener("click", function(e){
    var kb = e.target.closest ? e.target.closest("[data-cap-kind]") : null;
    if(kb){
      if(capBusy) return;
      var kp = kb.dataset.capKind.split("|"), ki = capDraft[+kp[1]];
      if(ki){ switchKind(ki, kp[0]); renderDraft(); }
      return;
    }
    var b = e.target.closest ? e.target.closest("[data-cap-rm]") : null;
    if(!b || capBusy) return;
    capDraft.splice(+b.dataset.capRm, 1);
    if(!capDraft.length){ leaveDraft(); capSay("Nothing left to capture. Your text is still in the box."); capText.focus(); return; }
    renderDraft();
    capSay(plural(capDraft.length, "item", "items") + " ready. Edit if needed, then Capture." + BACK);
  });

  // Refine: shows an editable draft. Writes nothing.
  function doRefine(){
    var raw = trim(capText.value);
    if(!raw){ capText.focus(); return; }
    capBusy = true; updateCapUI(); capSay("Refining with Claude\u2026 this can take up to a minute.");
    sampleFn.json(buildPrompt(raw, capAs), {cache: false}).then(function(out){
      var arr = Array.isArray(out) ? out : (out && Array.isArray(out.items) ? out.items : null);
      var items = (arr || []).slice(0, 8).map(cleanItem).filter(function(x){ return x; });
      if(!items.length) throw {code: "invalid_json"};
      capDraft = items; capOrig = raw; capMode = "draft";
      capText.readOnly = true;
      capOn = false; // refined: the button turns back into Capture
      renderDraft();
      capSay(plural(items.length, "item", "items") + " ready. Edit if needed, then Capture." + BACK);
    }).catch(function(e){
      var code = e && e.code;
      if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        sampleFn = null;
        capSay("Refining isn\u2019t available here. Capture saves your text as typed.");
      } else if(code === "rate_limited"){
        capSay("Claude usage limit reached. Nothing was captured; turn Refine off to capture as typed.");
      } else if(code === "cancelled"){
        capSay("");
      } else {
        capSay("Couldn\u2019t refine. Nothing was captured; try again or turn Refine off to capture as typed.");
      }
    }).then(function(){ capBusy = false; updateCapUI(); });
  }

  function captureRaw(){
    var raw = trim(capText.value);
    if(!raw){ capText.focus(); return; }
    var now = nowIso(), id = newId("i_");
    var first = raw.replace(/\s+/g, " ");
    if(first.length > 90) first = first.slice(0, 89) + "\u2026";
    capBusy = true; updateCapUI(); capSay("Saving\u2026");
    var asNote = capAs === "note";
    db.doc("inbox/" + id).set(asNote ? {
      kind: "note", raw: raw, body: raw.slice(0, 2000), subject: "", source: "typed on ledger page", created: now, unrefined: true
    } : {
      kind: "task", raw: raw, title: first, direction: "mine", counterparty: "", subject: "", due: "",
      priority: "normal", next_action: "", source: "typed on ledger page", created: now, unrefined: true
    }).then(function(){
      capText.value = ""; capText.style.height = ""; capAs = "task";
      capSay("Queued 1." + REVIEW);
    }, function(err){
      console.error("capture failed", err);
      capSay("Not saved. Your text is still in the box.");
    }).then(function(){ capBusy = false; capOn = capDefault && !!sampleFn; updateCapUI(); });
  }

  function captureDraft(){
    for(var i = 0; i < capDraft.length; i++){
      var it = capDraft[i];
      if(it.kind === "note" ? !trim(it.body || "") : !trim(it.title || "")){
        capSay("Item " + (i + 1) + " needs " + (it.kind === "note" ? "text" : "a title") + ", or remove it.");
        var el = capDraftEl.querySelector('[data-i="' + i + '"][data-cap-f="' + (it.kind === "note" ? "body" : "title") + '"]');
        if(el) el.focus();
        return;
      }
    }
    var items = capDraft.slice(), total = items.length, base = Date.now();
    capBusy = true; updateCapUI(); capSay("Saving\u2026");
    var chain = Promise.resolve();
    items.forEach(function(it, i){
      chain = chain.then(function(){
        var created = new Date(base + i).toISOString();
        var doc = it.kind === "note"
          ? {kind: "note", raw: capOrig, body: trim(it.body), subject: it.subject || "", source: "typed on ledger page", created: created}
          : {kind: "task", raw: capOrig, title: trim(it.title), direction: it.direction === "theirs" ? "theirs" : "mine",
             counterparty: trim(it.counterparty || ""), subject: it.subject || "", due: validDay(it.due || "") ? it.due : "",
             priority: it.priority || "normal", next_action: trim(it.next_action || ""),
             source: "typed on ledger page", created: created, unrefined: false};
        return db.doc("inbox/" + newId("i_") + "x" + i).set(doc).then(function(){ it._saved = true; });
      });
    });
    chain.then(function(){
      capText.value = ""; capText.style.height = ""; capAs = "task";
      leaveDraft();
      capSay("Queued " + total + "." + REVIEW);
    }, function(err){
      console.error("capture failed", err);
      var left = capDraft.filter(function(x){ return !x._saved; });
      var saved = total - left.length;
      capDraft = left; renderDraft();
      capSay((saved ? "Saved " + saved + " of " + total + ". " : "Not saved. ") + "The rest is still here; tap Capture to retry." + BACK);
    }).then(function(){ capBusy = false; updateCapUI(); });
  }

  function capture(){
    if(!db || capBusy) return;
    if(capWantsRefine()){ doRefine(); return; }
    if(capMode === "draft") captureDraft(); else captureRaw();
  }
  updateCapUI();

  /* ---------- sticky tab bar edge ---------- */
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(entries){
      $("tabsBar").classList.toggle("stuck", !entries[0].isIntersecting);
    }).observe($("sentinel"));
  }

  /* ---------- data ---------- */
  function shape(d, snapDoc){
    var o = {};
    for(var k in d) if(has(d,k)) o[k] = d[k];
    o.id = snapDoc.id;
    return o;
  }

  function subscribe(name, key){
    db.collection(name).onSnapshot(function(snap){
      var out = [];
      snap.docs.forEach(function(doc){
        var data = typeof doc.data === "function" ? doc.data() : doc.data;
        out.push(shape(data || {}, doc));
      });
      S[key] = out;
      S.loaded = true;
      requestRender();
    }, function(err){
      console.error(name + " subscription ended", err);
    });
  }

  initTheme();
  render();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("sample").then(function(fn){
      sampleFn = (typeof fn === "function") ? fn : null;
      if(!sampleFn) capOn = false;
      updateCapUI();
    }).catch(function(){ sampleFn = null; capOn = false; updateCapUI(); });
  } else { sampleFn = null; capOn = false; updateCapUI(); }

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(handle){
      S.triedConnect = true;
      if(!handle){ S.connected = false; S.loaded = false; render(); return; }
      db = handle; S.connected = true;
      capReady();
      subscribe("subjects", "subjects");
      subscribe("tasks", "tasks");
      subscribe("notes", "notes");
      subscribe("inbox", "inbox");
      setTimeout(function(){ if(!S.loaded){ S.loaded = true; requestRender(); } }, 1200);
    }).catch(function(){ S.triedConnect = true; S.connected = false; render(); });
  } else {
    S.triedConnect = true; S.connected = false; render();
  }
})();
</script>
</body>
</html>
